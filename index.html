<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Block All Analytics & Tracking -->
    <meta name="robots" content="index, follow">
    <meta http-equiv="x-dns-prefetch-control" content="off">
    
    <!-- Favicons - No Nonsense Logo -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="description" content="No Nonsense - Caffeinated Protein Drink. Big Energy, Zero Nonsense." />
    <title>No Nonsense | Caffeinated Protein Drink</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="No Nonsense" />
    <link rel="apple-touch-icon" href="/logo.png" />
    
    <!-- Android Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Preconnect to improve performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- DNS prefetch for faster resource loading -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    
    <!-- Preload critical resources -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" />
    
    <!-- Preload 3D models for faster loading (mobile lineup) -->
    <link rel="preload" href="/Can3DMango.html" as="document" />
    <link rel="preload" href="/3DCanCoffeecola.html" as="document" />
    <link rel="preload" href="/3DCanClassicWildBerry.html" as="document" />
    
    <!-- Performance hints -->
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark" />
    
    <!-- Mobile Performance -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="HandheldFriendly" content="true" />
    
    <!-- Disable tap highlight on mobile -->
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    

    <!-- Block Analytics & Tracking -->
    <script>
      // Disable Google Analytics globally
      window['ga-disable-all'] = true;
      
      // Block dataLayer
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push = function() { return 0; };
      
      // Block gtag
      window.gtag = function() { return false; };
      
      // Block common analytics
      window._gaq = { push: function() {} };
      window._gat = { _getTracker: function() { return { _trackPageview: function() {} }; } };
    </script>

    <!-- Register Service Worker for offline support -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('✅ Service Worker registered:', reg.scope))
            .catch(err => console.log('❌ Service Worker registration failed:', err))
        })
      }
    </script>
  </body>
</html>
